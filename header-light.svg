<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Sylvester Otieno — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="55%" stop-color="#ECEFF4"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <linearGradient id="drs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A876" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00A876" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00A876" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DDE2EA" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="220" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#grid)" opacity="0.55"/>

    <!-- kerb stripe, top -->
    <g>
      <rect x="0" y="0" width="1000" height="6" fill="#E10600"/>
      <g fill="#FFFFFF">
        <rect x="40" y="0" width="20" height="6"/>
        <rect x="100" y="0" width="20" height="6"/>
        <rect x="160" y="0" width="20" height="6"/>
        <rect x="220" y="0" width="20" height="6"/>
        <rect x="280" y="0" width="20" height="6"/>
        <rect x="340" y="0" width="20" height="6"/>
      </g>
    </g>

    <!-- telemetry trace -->
    <path d="M0 172 L70 172 L92 128 L150 128 L172 176 L250 176 L268 112 L340 112 L360 168 L440 168
             L462 96 L540 96 L560 160 L650 160 L672 120 L760 120 L782 178 L1000 178"
          fill="none" stroke="#C9D1DC" stroke-width="2"/>
    <path d="M0 172 L70 172 L92 128 L150 128 L172 176 L250 176 L268 112 L340 112 L360 168 L440 168
             L462 96 L540 96 L560 160 L650 160 L672 120 L760 120 L782 178 L1000 178"
          fill="none" stroke="#00A876" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="1600" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1600;0" dur="2.6s" fill="freeze"/>
    </path>

    <!-- start lights -->
    <g transform="translate(56,54)">
      <rect x="-10" y="-12" width="192" height="40" rx="6" fill="#E4E8EF" stroke="#C9D1DC"/>
      <circle cx="8"   cy="8" r="9" fill="#E4C9CB"><animate attributeName="fill" values="#E4C9CB;#E10600" begin="0.2s" dur="0.1s" fill="freeze"/></circle>
      <circle cx="42"  cy="8" r="9" fill="#E4C9CB"><animate attributeName="fill" values="#E4C9CB;#E10600" begin="0.5s" dur="0.1s" fill="freeze"/></circle>
      <circle cx="76"  cy="8" r="9" fill="#E4C9CB"><animate attributeName="fill" values="#E4C9CB;#E10600" begin="0.8s" dur="0.1s" fill="freeze"/></circle>
      <circle cx="110" cy="8" r="9" fill="#E4C9CB"><animate attributeName="fill" values="#E4C9CB;#E10600" begin="1.1s" dur="0.1s" fill="freeze"/></circle>
      <circle cx="144" cy="8" r="9" fill="#E4C9CB"><animate attributeName="fill" values="#E4C9CB;#E10600" begin="1.4s" dur="0.1s" fill="freeze"/></circle>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.15s" fill="freeze"/>
        <circle cx="8"   cy="8" r="9" fill="#E4E8EF"/>
        <circle cx="42"  cy="8" r="9" fill="#E4E8EF"/>
        <circle cx="76"  cy="8" r="9" fill="#E4E8EF"/>
        <circle cx="110" cy="8" r="9" fill="#E4E8EF"/>
        <circle cx="144" cy="8" r="9" fill="#E4E8EF"/>
      </g>
    </g>

    <!-- name -->
    <text x="56" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="46" font-weight="800" letter-spacing="-1.2" fill="#0B0E14" opacity="1">
      SYLVESTER OTIENO
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.92;1" dur="2.3s" fill="freeze"/>
    </text>

    <text x="58" y="160" font-family="'Consolas', 'SF Mono', monospace"
          font-size="14" letter-spacing="3.6" fill="#00A876" opacity="1">
      SOFTWARE ENGINEER · FULL STACK · NAIROBI
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.93;1" dur="2.6s" fill="freeze"/>
    </text>

    <!-- driver number -->
    <text x="944" y="150" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="110" font-weight="800" fill="#E10600" opacity="0.12">976</text>

    <!-- DRS zone marker -->
    <rect x="0" y="206" width="1000" height="3" fill="url(#drs)"/>
    <rect x="-300" y="0" width="300" height="220" fill="url(#sweep)">
      <animate attributeName="x" from="-300" to="1000" dur="2.8s" begin="2.4s" repeatCount="indefinite"/>
    </rect>

    <rect width="1000" height="220" rx="10" fill="none" stroke="#C9D1DC" stroke-width="2"/>
  </g>
</svg>
