<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="16" viewBox="0 0 1000 16" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39445A" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#39445A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39445A" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1000" height="16" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- kerb stripe -->
  <rect x="0" y="5" width="1000" height="3" fill="#E10600"/>
  <g fill="#F2F2F2">
    <rect x="40" y="5" width="20" height="3"/><rect x="100" y="5" width="20" height="3"/>
    <rect x="160" y="5" width="20" height="3"/><rect x="220" y="5" width="20" height="3"/>
    <rect x="280" y="5" width="20" height="3"/><rect x="340" y="5" width="20" height="3"/>
  </g>

  <!-- trailing circuit line -->
  <line x1="360" y1="11" x2="1000" y2="11" stroke="#39445A" stroke-width="1.6" stroke-dasharray="9 13" mask="url(#fadeMask)"/>

  <!-- tail light -->
  <circle cx="994" cy="11" r="2.4" fill="#E10600" opacity="0.55"/>
</svg>
